<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEV HOST — Mop &amp; Galaxy</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=VT323&display=swap">
<style>
  html, body { margin: 0; background: #120f22; color: #f2eeff; font-family: "Atkinson Hyperlegible", system-ui, sans-serif; }
  body { padding: 0 16px 48px; }
  .devbar { position: sticky; top: 0; z-index: 5; background: #3a1010; border-bottom: 3px solid #ff5555; color: #fff; padding: 8px 12px; margin: 0 -16px 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: 13px; }
  .devbar b { font-family: "Pixelify Sans", monospace; letter-spacing: .08em; color: #ffff55; }
  .devbar select, .devbar button, .devbar label { font: inherit; }
  .devbar button { background: #000; color: #fff; border: 1px solid #ff5555; padding: 3px 8px; cursor: pointer; border-radius: 2px; }
  .devbar label { display: inline-flex; gap: 4px; align-items: center; }
  .devlog { position: fixed; right: 8px; bottom: 8px; width: 300px; max-height: 160px; overflow: auto; background: rgba(0,0,0,.85); border: 1px solid #3b3266; font: 11px/1.3 "VT323", monospace; font-size: 14px; padding: 6px; color: #a99fcf; z-index: 4; }
  .devlog div { white-space: nowrap; }
  #game { max-width: 1040px; margin: 0 auto; }
  @media (orientation: landscape) and (max-height: 540px) { .devbar, .devlog { display: none; } body { padding: 0; } }
</style>
</head>
<body>
<div class="devbar" role="region" aria-label="Local development controls">
  <b>LOCAL DEV HOST</b>
  <span>Synthetic players only. No accounts, payments or emails. Hint text comes from <code>src/</code>, not <code>public/</code>.</span>
  <label>Player
    <select id="player">
      <option value="anon">anon (signed out)</option>
      <option value="free">free player</option>
      <option value="owner">game owner</option>
      <option value="walkthrough">walkthrough owner</option>
    </select>
  </label>
  <button id="reset" type="button">Reset this player's save</button>
  <label><input type="checkbox" id="failSaves"> Fail saves</label>
  <label><input type="checkbox" id="failHints"> Fail hints</label>
  <label>Latency <input type="number" id="latency" value="0" min="0" max="5000" step="100" style="width:70px"> ms</label>
  <button id="remount" type="button">Remount</button>
</div>
<div id="game"></div>
<div class="devlog" id="devlog" aria-live="off"></div>
<script type="module">
  import { createFixtureAdapter } from './fixture-adapter.js';
  import { mount } from '../../public/games/mop-galaxy/game.js';
  const q = new URLSearchParams(location.search);
  const sel = document.getElementById('player');
  sel.value = q.get('player') || 'free';
  const adapter = createFixtureAdapter(sel.value);
  window.__plAdapter = adapter; // for tests and manual poking
  const logEl = document.getElementById('devlog');
  window.addEventListener('pl-fixture-log', e => { const d = document.createElement('div'); d.textContent = `${e.detail.op} ${JSON.stringify(e.detail.detail)}`; logEl.prepend(d); while (logEl.children.length > 60) logEl.lastChild.remove(); });
  let handle = null;
  async function doMount() {
    if (handle) handle.unmount();
    handle = await mount(document.getElementById('game'), adapter, { onExit: reason => { const d = document.createElement('div'); d.textContent = `onExit(${reason}) — the arcade shell would show the catalogue here.`; logEl.prepend(d); } });
    window.__plGame = handle;
  }
  sel.addEventListener('change', () => { adapter.__setPlayer(sel.value); history.replaceState(null, '', '?player=' + sel.value); });
  document.getElementById('reset').addEventListener('click', () => { adapter.__reset(); doMount(); });
  document.getElementById('failSaves').addEventListener('change', e => adapter.__faults.failSaves = e.target.checked);
  document.getElementById('failHints').addEventListener('change', e => adapter.__faults.failHints = e.target.checked);
  document.getElementById('latency').addEventListener('change', e => adapter.__faults.latency = Number(e.target.value) || 0);
  document.getElementById('remount').addEventListener('click', doMount);
  doMount();
</script>
</body>
</html>
